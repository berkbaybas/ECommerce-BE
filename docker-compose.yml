services:
  mongo:
    image: mongo:7
    container_name: ecommerce-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: ecommerce-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Tokens always carry the browser-facing issuer (localhost), while the API container
      # reaches Keycloak at keycloak:8080 for discovery/JWKS (backchannel).
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json

  product-api:
    build: .
    container_name: ecommerce-product-api
    depends_on:
      - mongo
      - keycloak
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoSettings__ConnectionString: mongodb://mongo:27017
      OAuth__Authority: http://localhost:8080/realms/ecommerce
      OAuth__MetadataAddress: http://keycloak:8080/realms/ecommerce/.well-known/openid-configuration
    ports:
      - "5018:5018"

volumes:
  mongo-data:
